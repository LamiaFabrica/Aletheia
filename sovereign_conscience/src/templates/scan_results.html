{% extends 'base.html' %}
{% block title %}Scan Results - Medusa{% endblock %}
{% set page = 'scan_results' %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Scan Results</h2>
    
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Recent Scans</h5>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newScanModal">
                    <i class="bi bi-plus-lg"></i> New Scan
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Target</th>
                            <th>Hosts</th>
                            <th>Ports</th>
                            <th>High Risk</th>
                            <th>Risk Score</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="scanResults">
                        <!-- Scan results will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- New Scan Modal -->
<div class="modal fade" id="newScanModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title">New Scan</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="scanForm">
                    <div class="mb-3">
                        <label for="target" class="form-label">Target</label>
                        <input type="text" class="form-control" id="target" name="target" required
                               placeholder="IP address, hostname, or network range">
                    </div>
                    <div class="mb-3">
                        <label for="scanType" class="form-label">Scan Type</label>
                        <select class="form-select" id="scanType" name="scan_type" required>
                            <option value="quick">Quick Scan</option>
                            <option value="full">Full Scan</option>
                            <option value="vulnerability">Vulnerability Scan</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="ports" class="form-label">Ports</label>
                        <input type="text" class="form-control" id="ports" name="ports" 
                               placeholder="e.g., 80,443,8080 or 1-1000">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="startScan()">Start Scan</button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadScanResults() {
    try {
        const response = await fetch('/api/scan-results');
        const results = await response.json();
        const tbody = document.getElementById('scanResults');
        tbody.innerHTML = '';
        
        for (const result of results) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${new Date(result.scan_date).toLocaleString()}</td>
                <td>${result.target}</td>
                <td>${result.total_hosts}</td>
                <td>${result.total_ports}</td>
                <td>${result.high_risk_ports}</td>
                <td>${result.average_risk_score.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="viewDetails(${result.id})">
                        <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteScan(${result.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

async function startScan() {
    const form = document.getElementById('scanForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch('/api/scan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.error) {
            alert(result.error);
        } else {
            bootstrap.Modal.getInstance(document.getElementById('newScanModal')).hide();
            form.reset();
            loadScanResults();
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to start scan');
    }
}

async function viewDetails(scanId) {
    // TODO: Implement scan details view
    alert('View details not implemented yet');
}

async function deleteScan(scanId) {
    if (!confirm('Are you sure you want to delete this scan?')) return;
    
    try {
        await fetch(`/api/scan/${scanId}`, { method: 'DELETE' });
        loadScanResults();
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to delete scan');
    }
}

// Load scan results on page load
loadScanResults();
</script>
{% endblock %}
